
name: Build C++ EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile C++
        run: |
          g++ main.cpp -o program.exe -static -O2

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CPP-Windows-EXE
          path: program.exe
